apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovro-approval-proxy
  namespace: ovro-system
  labels:
    app: ovro-approval-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovro-approval-proxy
  template:
    metadata:
      labels:
        app: ovro-approval-proxy
    spec:
      serviceAccountName: ovro-approval-proxy
      containers:
        - name: approval-proxy
          image: image-registry.openshift-image-registry.svc:5000/ovro-system/ovro-approval-proxy:main
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: "https://ovro-backend.ovro-system.svc:8443"
            - name: SIGNING_KEY_PATH
              value: "/etc/ovro/signing-key/key"
            - name: TLS_CERT_FILE
              value: "/etc/ovro/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/ovro/tls/tls.key"
          volumeMounts:
            - name: signing-key
              mountPath: /etc/ovro/signing-key
              readOnly: true
            - name: tls
              mountPath: /etc/ovro/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: signing-key
          secret:
            secretName: ovro-approval-signing-key
        - name: tls
          secret:
            secretName: ovro-approval-proxy-tls
