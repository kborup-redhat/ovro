apiVersion: v1
kind: Service
metadata:
  name: ovro-approval-proxy
  namespace: ovro-system
  labels:
    app: ovro-approval-proxy
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ovro-approval-proxy-tls
spec:
  selector:
    app: ovro-approval-proxy
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
