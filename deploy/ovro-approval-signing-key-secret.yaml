# Generate a signing key:
#   openssl rand -base64 32 | oc create secret generic ovro-approval-signing-key \
#     --from-literal=key=$(cat -) -n ovro-system
# This template is for reference only — do not commit real keys.
apiVersion: v1
kind: Secret
metadata:
  name: ovro-approval-signing-key
  namespace: ovro-system
  labels:
    app: ovro
type: Opaque
stringData:
  key: "REPLACE_WITH_GENERATED_SIGNING_KEY"
