apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: ovro-system
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: ovro
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: ovro
    spec:
      containers:
        - name: victoriametrics
          image: docker.io/victoriametrics/victoria-metrics:v1.141.0
          args:
            - -retentionPeriod=90d
            - -storageDataPath=/victoria-metrics-data
            - -httpListenAddr=:8428
          ports:
            - containerPort: 8428
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
