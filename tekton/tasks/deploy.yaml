apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ovro-deploy
  namespace: ovro-system
spec:
  params:
    - name: backend-image
      type: string
    - name: plugin-image
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -ex

        # Deploy CRDs, RBAC, and manager via kustomize overlay
        oc apply -k config/default/

        # Deploy console plugin and namespace resources
        oc apply -f deploy/

        # Update deployment images
        oc set image deployment/ovro-controller-manager \
          manager=$(params.backend-image) \
          -n ovro-system

        oc set image deployment/ovro-console-plugin \
          plugin=$(params.plugin-image) \
          -n ovro-system || echo "Console plugin deployment not yet created"

        echo "Deploy complete"
