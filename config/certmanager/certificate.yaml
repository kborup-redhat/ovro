apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ovro-backend-cert
  namespace: ovro-system
spec:
  secretName: ovro-backend-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
    - ovro-backend.ovro-system.svc
    - ovro-backend.ovro-system.svc.cluster.local
