apiVersion: rightsizing.redhatconsulting.io/v1alpha1
kind: RightsizingPolicy
metadata:
  name: default
spec:
  lookbackDays: 30
  algorithm:
    percentile: 95
    headroomPercent: 20
  thresholds:
    minCpuSavings: 1
    minMemorySavings: 1Gi
    upsizeUtilizationPercent: 90
  revertRetentionDays: 30
  autoMode:
    enabled: false
    schedule: "0 2 * * *"
    requireApproval: true
  reconcileIntervalMinutes: 60
  metricsStorage:
    retentionDays: 90
    storageSize: 50Gi
