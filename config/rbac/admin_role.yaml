apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ovro-admin
rules:
  - apiGroups: ["rightsizing.redhatconsulting.io"]
    resources: ["rightsizingrecommendations", "rightsizingpolicies"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["rightsizing.redhatconsulting.io"]
    resources: ["rightsizingrecommendations/status"]
    verbs: ["update", "patch"]
