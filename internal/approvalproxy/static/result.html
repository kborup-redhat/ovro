<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVRO - {{.Title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'RedHatText', 'Helvetica Neue', Arial, sans-serif;
            background: #F0F0F0;
            color: #151515;
            line-height: 1.5;
        }
        .header {
            background: #151515;
            color: #FFFFFF;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 500;
        }
        .header .brand {
            color: #EE0000;
            font-weight: 700;
        }
        .container {
            max-width: 560px;
            margin: 64px auto;
            padding: 0 16px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #D2D2D2;
            border-radius: 3px;
            text-align: center;
            padding: 48px 32px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: #E7F1E4;
            color: #3E8635;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .message {
            font-size: 14px;
            color: #6A6E73;
            max-width: 400px;
            margin: 0 auto;
        }
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: #6A6E73;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="brand">OVRO</span> &mdash; VM Rightsizing Approval</h1>
    </div>
    <div class="container">
        <div class="card">
            <div class="icon">&#10003;</div>
            <div class="title">{{.Title}}</div>
            <div class="message">{{.Message}}</div>
        </div>
    </div>
    <div class="footer">
        OVRO &mdash; OpenShift Virtual Machine Rightsizing Operator
    </div>
</body>
</html>
